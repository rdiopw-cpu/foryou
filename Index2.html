<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Tarot Reader</title>
    <style>
        :root {
            --bg: #0a0a0e;
            --surface: #15151d;
            --gold: #d4af37;
            --text: #e0e0e0;
            --card-w: 70px;
            --card-h: 110px;
        }

        /* Penyesuaian ukuran untuk layar sangat kecil */
        @media (max-width: 380px) {
            :root { --card-w: 60px; --card-h: 95px; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* AREA READING (ATAS) */
        #reading-area {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        #status-msg {
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            height: 20px;
        }

        /* GRID LAYOUT SESUAI INSTRUKSI */
        .tarot-grid {
            display: grid;
            /* Kita buat grid 4 kolom x 3 baris */
            grid-template-areas: 
                ".  p3  .   p8"
                "p1 p2  p5  p7"
                ".  p4  .   p6";
            gap: 15px;
            align-items: center;
            justify-items: center;
        }

        .slot {
            width: var(--card-w);
            height: var(--card-h);
            border: 1px dashed rgba(211, 175, 55, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            position: relative;
        }

        /* Mapping Area */
        .slot[data-pos="1"] { grid-area: p1; }
        .slot[data-pos="2"] { grid-area: p2; }
        .slot[data-pos="3"] { grid-area: p3; }
        .slot[data-pos="4"] { grid-area: p4; }
        .slot[data-pos="5"] { grid-area: p5; }
        .slot[data-pos="6"] { grid-area: p6; }
        .slot[data-pos="7"] { grid-area: p7; }
        .slot[data-pos="8"] { grid-area: p8; }

        /* AREA DECK (BAWAH) */
        #deck-area {
            flex: 1;
            background: var(--surface);
            border-top: 1px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* STYLING KARTU */
        .card {
            width: var(--card-w);
            height: var(--card-h);
            position: absolute;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 10;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            width: 100%; height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 6px;
            border: 1px solid var(--gold);
            overflow: hidden;
        }

        .card-back {
            background: linear-gradient(45deg, #1a1a24 25%, #2a2a35 25%, #2a2a35 50%, #1a1a24 50%, #1a1a24 75%, #2a2a35 75%);
            background-size: 10px 10px;
        }

        .card-front {
            transform: rotateY(180deg);
            background: #000;
        }

        .card-front img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-name {
            position: absolute;
            bottom: 0; width: 100%;
            background: rgba(0,0,0,0.8);
            font-size: 0.55rem;
            padding: 2px;
            text-align: center;
            color: var(--gold);
        }

        /* Rotasi Khusus */
        .card.horizontal .card-inner { transform: rotate(90deg); }
        .card.horizontal.flipped .card-inner { transform: rotate(90deg) rotateY(180deg); }

        /* OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="reading-area">
        <div id="status-msg">Tekan Shuffle untuk mulai</div>
        <div class="tarot-grid">
            <div class="slot" data-pos="3">3</div>
            <div class="slot" data-pos="1">1</div>
            <div class="slot" data-pos="2">2</div>
            <div class="slot" data-pos="5">5</div>
            <div class="slot" data-pos="8">8</div>
            <div class="slot" data-pos="7">7</div>
            <div class="slot" data-pos="4">4</div>
            <div class="slot" data-pos="6">6</div>
        </div>
    </div>

    <div id="deck-area"></div>

    <div id="intro-overlay" class="overlay">
        <h2 style="color:var(--gold)">Mystic Tarot</h2>
        <p style="margin-top:10px; text-align:center">Tarik nafas dalam, fokuskan pertanyaan Anda.</p>
        <button class="btn" onclick="initDeck()">Shuffle & Start</button>
    </div>

    <div id="reset-container" style="display:none; position:fixed; bottom:20px; right:20px; z-index:200">
        <button class="btn" style="padding: 8px 15px; font-size: 0.8rem;" onclick="location.reload()">Reset</button>
    </div>

<script>
    const IMG_URL = "https://ishtarcollective.blob.core.windows.net/rider-waite-tarot/";
    let drawnCount = 0;
    const cards = [];

    // Data kartu disingkat untuk efisiensi file
    const majors = ["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Strength","The Hermit","Wheel of Fortune","Justice","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
    const suits = ['wands', 'cups', 'swords', 'pentacles'];
    const ranks = ['Ace','2','3','4','5','6','7','8','9','10','Page','Knight','Queen','King'];

    function initDeck() {
        document.getElementById('intro-overlay').style.display = 'none';
        const deckArea = document.getElementById('deck-area');
        deckArea.innerHTML = '';
        
        const allCards = [];
        majors.forEach((m, i) => allCards.push({ name: m, img: `major-${i}.jpg` }));
        suits.forEach(s => {
            ranks.forEach((r, i) => allCards.push({ name: `${r} of ${s}`, img: `${s}-${i+1}.jpg` }));
        });

        // Shuffle array
        allCards.sort(() => Math.random() - 0.5);

        allCards.forEach((data, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front">
                        <img src="${IMG_URL}${data.img}">
                        <div class="card-name">${data.name}</div>
                    </div>
                </div>
            `;
            
            // Posisi acak di deck
            const rx = Math.random() * (deckArea.clientWidth - 60);
            const ry = Math.random() * (deckArea.clientHeight - 90);
            card.style.left = rx + 'px';
            card.style.top = ry + 'px';
            card.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;

            card.onclick = () => drawCard(card);
            deckArea.appendChild(card);
        });

        updateStatus();
    }

    function drawCard(card) {
        if (drawnCount >= 8 || card.classList.contains('drawn')) return;
        
        card.classList.add('drawn');
        drawnCount++;
        updateStatus();

        const targetSlot = document.querySelector(`.slot[data-pos="${drawnCount}"]`);
        const slotRect = targetSlot.getBoundingClientRect();
        const deckArea = document.getElementById('deck-area');
        const deckRect = deckArea.getBoundingClientRect();

        // Tentukan posisi akhir relatif terhadap body agar animasi smooth
        const finalX = slotRect.left;
        const finalY = slotRect.top;

        // Cek Reversal (50/50)
        const isReversed = Math.random() > 0.5;
        const img = card.querySelector('img');
        if (isReversed) {
            img.style.transform = 'rotate(180deg)';
            card.querySelector('.card-name').innerText += " (Rev)";
        }

        // Pindah ke posisi target
        card.style.zIndex = 100 + drawnCount;
        card.style.position = 'fixed'; 
        card.style.left = card.getBoundingClientRect().left + 'px';
        card.style.top = card.getBoundingClientRect().top + 'px';

        // Animasi ke slot
        setTimeout(() => {
            // Khusus kartu 1 (Horizontal) dan 2 (Vertikal/Horizontal overlap)
            if (drawnCount === 1) card.classList.add('horizontal');
            if (drawnCount === 2) card.classList.add('horizontal'); // Menyesuaikan layout 1&2 berdampingan

            card.style.left = finalX + 'px';
            card.style.top = finalY + 'px';
            card.style.transform = 'rotate(0deg)';
            card.classList.add('flipped');
        }, 50);

        if (drawnCount === 8) {
            document.getElementById('reset-container').style.display = 'block';
            document.getElementById('deck-area').style.opacity = '0.3';
        }
    }

    function updateStatus() {
        const msg = document.getElementById('status-msg');
        if (drawnCount === 0) msg.innerText = "Pilih kartu pertama Anda";
        else if (drawnCount < 8) msg.innerText = `Kartu ${drawnCount} terpilih. Ambil kartu berikutnya...`;
        else msg.innerText = "Selesai. Inilah tebaran kartu Anda.";
    }
</script>
</body>
</html>
